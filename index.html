<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>التسجيل | كشافة أبناء القرآن ورابطة خطى الشبابية</title>
<style>
:root{--bg:#08110e;--card:#101c17;--ink:#e9f2ed;--mute:#9db2a7;--line:#22352c;--b1:#137a6c;--b2:#1c9a8b;--teal:#2bb8a8;--red:#d4474a;--lime:#a6c53a;--green:#4f9a0e;--acc:#2fc4b2;--acc2:#2bb8a8;--soft:#14302a;--shadow:0 14px 44px rgba(0,0,0,.55);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

html{scroll-padding-top:env(safe-area-inset-top,0px)}
body.khatta{--acc:#8fd13a;--acc2:#6fb82a;--soft:#1b2e12;--b1:#3b7609;--b2:#58a01a}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI","Noto Naskh Arabic",Tahoma,Arial,sans-serif;line-height:1.75;position:relative;overflow-x:hidden}
body::before,body::after{content:"";position:fixed;width:420px;height:420px;border-radius:50%;filter:blur(90px);opacity:.28;z-index:0;pointer-events:none;transition:background .6s}
body::before{top:-140px;right:-120px;background:var(--acc2)}
body::after{bottom:-160px;left:-140px;background:var(--lime)}
.pat{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.5;background-image:radial-gradient(var(--line) 1.2px,transparent 1.3px);background-size:26px 26px}
.wrap{position:relative;z-index:1;max-width:1000px;margin:0 auto;padding:22px 16px 40px}
.hero{text-align:center;padding:10px 0 4px}
.logos{display:flex;justify-content:center;align-items:center;gap:14px;margin-bottom:14px}
.lg{width:92px;height:92px;border-radius:50%;background:#fff;padding:4px;box-shadow:var(--shadow);border:3px solid transparent;opacity:.55;transform:scale(.88);transition:.35s;cursor:pointer}
.lg img{width:100%;height:100%;border-radius:50%;display:block}
.lg.on{opacity:1;transform:scale(1.12);border-color:var(--acc2)}
.sep{width:1px;height:46px;background:var(--line)}
.hero h1{font-size:1.7rem;margin:6px 0 2px;line-height:1.4}
.hero p{margin:0 auto;color:var(--mute);max-width:520px}
.tabs{position:relative;display:flex;max-width:380px;margin:22px auto;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:5px;box-shadow:var(--shadow)}
.pill{position:absolute;top:5px;bottom:5px;width:calc(50% - 5px);right:5px;border-radius:14px;background:linear-gradient(135deg,var(--acc),var(--acc2));transition:transform .35s cubic-bezier(.5,.1,.2,1)}
.tab{position:relative;flex:1;border:0;background:none;font:inherit;font-weight:700;padding:11px 6px;color:var(--mute);cursor:pointer;transition:color .3s}
.tab[aria-selected=true]{color:#fff}
.grid{display:grid;grid-template-columns:1fr 1.1fr;gap:20px;align-items:start}
@media(max-width:780px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:24px 20px;box-shadow:var(--shadow);animation:up .5s both}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.card h2{margin:0 0 4px;font-size:1.2rem;color:var(--acc)}
.card .d{color:var(--mute);margin:0 0 16px;font-size:.95rem}
.feat{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.feat li{display:flex;gap:12px;align-items:center;background:var(--soft);border-radius:14px;padding:10px 12px;font-weight:600;font-size:.95rem}
.feat i{width:34px;height:34px;border-radius:10px;background:var(--card);display:grid;place-items:center;font-style:normal;font-size:1.1rem;flex:none}
.steps{display:flex;gap:6px;margin-top:18px;font-size:.8rem;color:var(--mute);text-align:center}
.steps div{flex:1}
.steps b{display:grid;place-items:center;width:28px;height:28px;margin:0 auto 4px;border-radius:50%;background:var(--acc);color:#fff}
.bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin:2px 0 6px}
.bar span{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc),var(--acc2));border-radius:6px;transition:width .4s}
.fld{position:relative;margin-top:14px}
.fld label{display:block;font-weight:700;font-size:.9rem;margin-bottom:6px}
.fld .ic{position:absolute;right:13px;bottom:13px;font-size:1.05rem;opacity:.7}
input{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:14px;padding:12px 42px 12px 14px;outline:none;transition:.2s}
input:focus{border-color:var(--acc);box-shadow:0 0 0 4px var(--soft);background:var(--card)}
input.ok{border-color:var(--acc2)}
input.bad{border-color:var(--red)}
input[type=tel],input[type=number]{direction:ltr;text-align:right}
.err{color:var(--red);font-size:.82rem;min-height:1.1em;margin-top:3px}
.go{width:100%;margin-top:18px;border:0;color:#fff;font:inherit;font-weight:800;font-size:1.05rem;padding:15px;border-radius:16px;cursor:pointer;background:linear-gradient(135deg,var(--acc),var(--acc2));box-shadow:0 8px 22px -8px var(--acc);transition:.2s}
.go:hover{transform:translateY(-1px)}
.go:disabled{opacity:.6}
.msg{color:var(--red);font-size:.88rem;text-align:center;margin-top:10px}
.done{display:none;text-align:center;padding:14px 4px}
.tick{width:78px;height:78px;border-radius:50%;margin:0 auto 12px;display:grid;place-items:center;color:#fff;font-size:2.2rem;background:linear-gradient(135deg,var(--acc),var(--acc2));animation:pop .5s both}
@keyframes pop{0%{transform:scale(.3);opacity:0}70%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}
.ref{display:inline-block;margin:10px 0;padding:8px 18px;border-radius:12px;background:var(--soft);font-weight:800;letter-spacing:1px;direction:ltr;color:var(--acc)}
.ghost{background:var(--soft);color:var(--acc);box-shadow:none}
.admin{margin-top:18px;padding:14px;border:1.5px dashed var(--line);border-radius:16px;text-align:center}
.admin button{border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:inherit;padding:8px 16px;border-radius:12px;cursor:pointer}
footer{text-align:center;color:var(--mute);font-size:.85rem;margin-top:26px}

.fld .ic{color:var(--acc);opacity:.85;display:flex}
#splash{position:fixed;inset:0;z-index:50;display:grid;place-items:center;text-align:center;padding:24px;padding-top:calc(24px + env(safe-area-inset-top,0px));background:linear-gradient(160deg,#07201c,#0d1a09 55%,#1c0b0c);transition:opacity .8s,transform .8s,visibility .8s;overflow:hidden}

#splash.gone{opacity:0;visibility:hidden;transform:scale(1.06)}
.bl{position:absolute;width:340px;height:340px;border-radius:50%;filter:blur(70px);opacity:.45;animation:dr 12s ease-in-out infinite alternate}
.bl.a{background:var(--teal);top:-80px;right:-80px}.bl.b{background:var(--lime);bottom:-100px;left:-80px;animation-delay:-5s}.bl.c{background:var(--red);width:200px;height:200px;opacity:.18;top:55%;right:30%;animation-delay:-8s}
@keyframes dr{to{transform:translate(40px,-30px) scale(1.15)}}
.sp-in{position:relative;max-width:420px;width:100%}
.sp-logos{position:relative;display:flex;justify-content:center;gap:16px;margin-bottom:22px}
.sp-logos img{width:112px;height:112px;border-radius:50%;background:#fff;padding:4px;box-shadow:0 14px 40px rgba(20,60,50,.18);animation:fl 5s ease-in-out infinite,up .9s both}
.sp-logos img:nth-child(2){animation-delay:-2.5s,.2s}
@keyframes fl{50%{transform:translateY(-9px)}}
.rings{position:absolute;left:50%;top:56px;width:0;height:0}
.rings i{position:absolute;width:150px;height:150px;margin:-75px;border:2px solid var(--teal);border-radius:50%;opacity:0;animation:rp 4.5s ease-out infinite}
.rings i:nth-child(2){animation-delay:1.5s}.rings i:nth-child(3){animation-delay:3s}
@keyframes rp{0%{transform:scale(.7);opacity:.5}100%{transform:scale(2.6);opacity:0}}
#splash h1{margin:0 0 6px;font-size:2rem;animation:up .9s .35s both}
#splash p{margin:0 0 24px;color:var(--mute);animation:up .9s .5s both}
.choices{display:grid;gap:12px}
.ch{border:0;font:inherit;font-weight:800;font-size:1.05rem;color:#fff;padding:16px 18px;border-radius:18px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;animation:up .9s both;transition:transform .2s}
.ch:hover{transform:translateY(-3px)}
.ch.s{background:linear-gradient(135deg,#1d9a8c,#2bb8a8);animation-delay:.65s;box-shadow:0 10px 26px -10px #1d9a8c}
.ch.k{background:linear-gradient(135deg,#4f9a0e,#7bbf2e);animation-delay:.8s;box-shadow:0 10px 26px -10px #4f9a0e}
svg.i,.ch svg,.mapbtn svg,.ic svg,.ri svg,.feat i svg{stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;width:20px;height:20px}
html:not(.entered) body{overflow:hidden}
.wrap{opacity:0;transform:translateY(18px);transition:opacity .9s .3s,transform .9s .3s}
.entered .wrap{opacity:1;transform:none}
.feat i{color:var(--acc)}
.loc{margin-top:20px;display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:center}
@media(max-width:780px){.loc{grid-template-columns:1fr}}
.map{height:180px;border-radius:18px;overflow:hidden;background:var(--soft)}
.map svg{width:100%;height:100%}
.map .rd{stroke:var(--card);fill:none;stroke-width:9;stroke-linecap:round}
.map .bk{fill:var(--line);opacity:.7}
.row{display:flex;gap:12px;align-items:flex-start;margin-top:12px}
.ri{width:38px;height:38px;border-radius:12px;background:var(--soft);color:var(--acc);display:grid;place-items:center;flex:none}
.row small{display:block;color:var(--mute);font-size:.8rem}
.mapbtn{display:inline-flex;gap:8px;align-items:center;margin-top:14px;padding:10px 16px;border-radius:14px;background:var(--acc);color:#fff;text-decoration:none;font-weight:700}
.pinp{animation:fl 2.5s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.go,.mapbtn{background:linear-gradient(135deg,var(--b1),var(--b2))!important;box-shadow:0 8px 22px -8px var(--b2)}
.go.ghost{background:var(--soft)!important;color:var(--acc)}
.lg:not(.on),.sep{display:none}
.hero .lg{width:124px;height:124px;opacity:1;transform:none;cursor:default}
.hero h1{font-size:2rem}
nav{position:sticky;top:8px;z-index:20;display:flex;align-items:center;gap:12px;padding:8px 12px;margin-bottom:10px;background:rgba(16,28,23,.78);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:18px}
nav img{width:38px;height:38px;border-radius:50%;background:#fff}
nav b{font-size:.95rem;flex:1}
nav a{color:var(--mute);text-decoration:none;font-size:.88rem;font-weight:600}
nav a:hover{color:var(--acc)}
@media(max-width:700px){nav a{display:none}}
nav button{border:1.5px solid var(--line);background:transparent;color:var(--ink);font:inherit;font-size:.85rem;padding:6px 12px;border-radius:12px;cursor:pointer}
#sp{position:fixed;top:0;right:0;height:3px;width:0;background:linear-gradient(90deg,var(--acc2),var(--lime));z-index:60}
.cta{display:inline-block;margin-top:16px;padding:12px 28px;border-radius:16px;color:#fff;text-decoration:none;font-weight:800;background:linear-gradient(135deg,var(--b1),var(--b2));box-shadow:0 10px 26px -10px var(--b2)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:22px 0}
.stat{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px 8px;text-align:center;box-shadow:var(--shadow)}
.stat b{display:block;font-size:2rem;line-height:1.2;color:var(--acc)}
.stat span{color:var(--mute);font-size:.88rem}
.rv{opacity:0;transform:translateY(22px);transition:opacity .7s,transform .7s;animation:none}
.rv.vis{opacity:1;transform:none}
#faq{margin-top:20px}
#faq h2{margin:0 0 10px}
details{border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:10px;background:var(--bg)}
summary{cursor:pointer;font-weight:700;list-style:none;display:flex;justify-content:space-between;gap:10px}
summary::after{content:"+";color:var(--acc);font-size:1.3rem;line-height:1}
details[open] summary::after{content:"−"}
details p{margin:8px 0 0;color:var(--mute)}
#splash .ch{color:#fff}

/* Responsive improvements for phones, tablets, and laptops */
img,svg,iframe{max-width:100%}
button,input,select,textarea{touch-action:manipulation}
button{ -webkit-tap-highlight-color:transparent }
input,select,textarea{font-size:16px;min-width:0}
.wrap{width:100%}
.card,.hero,.loc>*{min-width:0}
@media (min-width:1100px){
  .wrap{max-width:1120px;padding:28px 24px 48px}
  .grid{grid-template-columns:minmax(280px,.85fr) minmax(0,1.15fr);gap:24px}
  .card{padding:28px}
}
@media (max-width:780px){
  .wrap{padding:16px 12px 30px}
  .grid{grid-template-columns:minmax(0,1fr);gap:14px}
  .card{padding:20px 16px;border-radius:20px}
  .hero h1{font-size:clamp(1.25rem,5vw,1.65rem)}
  .hero p{font-size:.94rem;padding-inline:8px}
  .logos{gap:10px}
  .lg{width:76px;height:76px}
  .tabs{margin:16px auto;max-width:100%}
  .loc{grid-template-columns:minmax(0,1fr);gap:12px}
  .steps{gap:3px;font-size:.72rem}
  .feat li{align-items:flex-start}
  .go{min-height:50px}
}
@media (max-width:480px){
  .wrap{padding:12px 10px 24px}
  .card{padding:17px 13px;border-radius:18px}
  .hero{padding-top:4px}
  .logos{gap:8px;margin-bottom:10px}
  .lg{width:64px;height:64px;border-width:2px;padding:3px}
  .sep{height:34px}
  .hero h1{font-size:1.22rem;line-height:1.5}
  .hero p,.card .d{font-size:.88rem}
  .tab{font-size:.9rem;padding:10px 4px}
  .fld{margin-top:12px}
  input{padding:12px 40px 12px 10px;border-radius:12px}
  .fld .ic{right:11px}
  .feat li{gap:9px;padding:9px 10px;font-size:.88rem}
  .feat i{width:30px;height:30px}
  .steps b{width:25px;height:25px}
  #splash{padding-inline:16px}
  .sp-logos{gap:10px}
  .sp-logos img{width:88px;height:88px}
  #splash h1{font-size:1.55rem}
  #splash p{font-size:.92rem}
  .ch{font-size:.98rem;padding:14px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.01ms!important}
}

</style>
</head>
<body>
<div id="splash"><div class="bl a"></div><div class="bl b"></div><div class="bl c"></div>
<div class="sp-in"><div class="sp-logos"><div class="rings"><i></i><i></i><i></i></div><img id="sl1" alt=""><img id="sl2" alt=""></div>
<h1>أهلاً بك</h1><p>اختر الجهة التي تودّ التسجيل فيها</p>
<div class="choices"><button class="ch s" data-t="scout">كشافة أبناء القرآن <span data-i="arrow"></span></button><button class="ch k" data-t="khatta">رابطة خطى الشبابية <span data-i="arrow"></span></button></div></div></div>
<div class="pat"></div>
<div id="sp"></div>
<div class="wrap">
<nav><img id="nl" alt=""><b id="nt"></b><a href="#reg">التسجيل</a><a href="#faq">الأسئلة</a><a href="#loc">الموقع</a><button id="chg">تغيير الجهة</button></nav>

<h2 style="margin:0">تم استلام تسجيلك</h2>
<p class="d" style="margin:6px 0 0">رقم التسجيل الخاص بك</p>
<div class="ref" id="ref"></div>
<p class="d">شكراً لك، سنتواصل معك قريباً بإذن الله.</p>
<button class="go ghost" id="again">تسجيل شخص آخر</button>
</div>
</div>
</div>

<div class="card rv" id="faq"></div>
<div class="card loc rv" id="loc"></div>

<footer>كشافة أبناء القرآن · رابطة خطى الشبابية</footer>
</div>

<script>
var C={
scout:{cls:'',title:'كشافة أبناء القرآن',tag:'#لبناء_جيل_قرآني_متميز',fh:'استمارة التسجيل في الكشافة',g:true,pre:'SC',loc:{name:'مقر الكشافة',addr:'سيتم إضافة العنوان قريباً',mark:'سيتم إضافة أقرب نقطة دالة',q:''},
 ih:'عن الكشافة',id:'نبني جيلاً قرآنياً متميزاً بالتربية والمهارة والأخلاق.',
 f:[['book','برامج قرآنية وتربوية'],['tent','أنشطة ومعسكرات كشفية'],['shield','تنمية المهارات والقيادة']]},
khatta:{cls:'khatta',title:'رابطة خطى الشبابية',tag:'سجّل معنا وكن جزءاً من الرابطة',fh:'استمارة التسجيل في الرابطة',g:false,pre:'KH',loc:{name:'مقر الرابطة',addr:'سيتم إضافة العنوان قريباً',mark:'سيتم إضافة أقرب نقطة دالة',q:''},
 ih:'عن الرابطة',id:'رابطة شبابية تجمع الشباب على الخير والعمل والإبداع.',
 f:[['bulb','برامج وفعاليات شبابية'],['leaf','تطوير الذات والمهارات'],['target','مشاريع ومبادرات مجتمعية']]}};
var cur='scout';
function $(i){return document.getElementById(i)}
var P={user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-7 8-7s8 3 8 7"/>',cal:'<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/>',phone:'<rect x="7" y="2" width="10" height="20" rx="3"/><path d="M11 18h2"/>',users:'<circle cx="9" cy="8" r="3.5"/><path d="M2 20c0-3.500 3-6 7-6s7 2.500 7 6"/><path d="M16 5a3.500 3.500 0 010 7M18 14c2.500.7 4 2.600 4 6"/>',book:'<path d="M12 6C9.500 4.500 6 4.500 3 5.500v13c3-1 6.500-1 9 .5 2.500-1.500 6-1.500 9-.5v-13c-3-1-6.500-1-9 .5zM12 6v13"/>',tent:'<path d="M3 20L12 4l9 16zM12 4v16M9 20l3-6 3 6"/>',shield:'<path d="M12 3l8 3v6c0 5-3.500 8-8 9-4.500-1-8-4-8-9V6z"/><path d="M9 12l2 2 4-4"/>',bulb:'<path d="M9 18h6M10 21h4M12 3a6 6 0 00-4 10.500c.7.7 1 1.500 1 2.500h6c0-1 .3-1.800 1-2.500A6 6 0 0012 3z"/>',leaf:'<path d="M5 19c0-9 5-14 15-14 0 10-5 15-14 15zM5 19l8-8"/>',target:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.500"/>',pin:'<path d="M12 22s7-6.500 7-12a7 7 0 10-14 0c0 5.500 7 12 7 12z"/><circle cx="12" cy="10" r="2.500"/>',flag:'<path d="M5 21V4M5 4h12l-2 4 2 4H5"/>',arrow:'<path d="M19 12H5M11 6l-6 6 6 6"/>'};
function ico(n){return '<svg class="i" viewBox="0 0 24 24">'+P[n]+'</svg>'}
document.querySelectorAll('[data-i]').forEach(function(e){e.innerHTML=ico(e.dataset.i)});
var MAP='<svg viewBox="0 0 300 180" preserveAspectRatio="xMidYMid slice"><rect class="bk" x="14" y="14" width="76" height="54" rx="8"/><rect class="bk" x="122" y="12" width="70" height="56" rx="8"/><rect class="bk" x="220" y="16" width="66" height="52" rx="8"/><rect class="bk" x="14" y="108" width="76" height="58" rx="8"/><rect class="bk" x="122" y="110" width="70" height="56" rx="8"/><rect class="bk" x="220" y="108" width="66" height="58" rx="8"/><path class="rd" d="M0 88H300M106 0V180M206 0V180"/><ellipse cx="106" cy="90" rx="11" ry="3.500" style="fill:var(--acc);opacity:.35"/><g transform="translate(106 88)"><g class="pinp"><path d="M0 0s15-13 15-26a15 15 0 10-30 0c0 13 15 26 15 26z" style="fill:var(--red)"/><circle cx="0" cy="-26" r="5.500" fill="#fff"/></g></g></svg>';
function toEn(s){return s.replace(/[٠-٩]/g,function(d){return d.charCodeAt(0)-1632})}
function okPhone(p){return /^\+?\d{8,15}$/.test(toEn(p).replace(/[\s-]/g,''))}
function setE(k,m){document.querySelector('[data-e='+k+']').textContent=m||''}
function show(t){cur=t;var c=C[t];document.body.classList.toggle('khatta',t==='khatta');
$('title').textContent=c.title;$('tag').textContent=c.tag;$('fh').textContent=c.fh;
$('gBox').style.display=c.g?'block':'none';


$('lgScout').classList.toggle('on',t==='scout');$('lgKhatta').classList.toggle('on',t==='khatta');
var li=c.f.map(function(x){return '<li><i>'+ico(x[0])+'</i>'+x[1]+'</li>'}).join('');
$('info').innerHTML='<h2>'+c.ih+'</h2><p class="d">'+c.id+'</p><ul class="feat">'+li+'</ul><div class="steps"><div><b>1</b>املأ الاستمارة</div><div><b>2</b>نستلم طلبك</div><div><b>3</b>نتواصل معك</div></div>';
$('loc').innerHTML='<div class="map">'+MAP+'</div><div><h2 style="margin:0;color:var(--acc)">'+c.loc.name+'</h2><div class="row"><div class="ri">'+ico('pin')+'</div><div><small>العنوان</small><b>'+c.loc.addr+'</b></div></div><div class="row"><div class="ri">'+ico('flag')+'</div><div><small>أقرب نقطة دالة</small><b>'+c.loc.mark+'</b></div></div>'+(c.loc.q?'<a class="mapbtn" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(c.loc.q)+'">'+ico('pin')+' فتح في الخرائط</a>':'')+'</div>';
var fq=[['كيف أتأكد أن تسجيلي وصل؟','بعد الإرسال يظهر لك رقم تسجيل خاص، احتفظ به للمراجعة.'],c.g?['لماذا نطلب رقم ولي الأمر؟','للتواصل معه وأخذ موافقته على مشاركة المسجَّل في الأنشطة.']:['هل أحتاج لرقم ولي الأمر؟','لا، يكفي الاسم والعمر ورقم الهاتف.'],['متى سيتم التواصل معي؟','سنتواصل معك على رقم الهاتف الذي أدخلته بعد مراجعة الطلب.'],['هل يمكن تسجيل أكثر من شخص؟','نعم، اضغط «تسجيل شخص آخر» بعد الإرسال.']];
$('faq').innerHTML='<h2>أسئلة شائعة</h2>'+fq.map(function(x){return '<details><summary>'+x[0]+'</summary><p>'+x[1]+'</p></details>'}).join('');
$('nt').textContent=c.title;$('nl').src=$(t==='scout'?'lgScout':'lgKhatta').querySelector('img').src;
$('formBox').style.display='block';$('done').style.display='none';$('msg').textContent='';prog()}

function checks(){var a=parseInt(toEn($('age').value),10);
var r={name:$('name').value.trim().length>=3,age:a>=5&&a<=60,phone:okPhone($('phone').value)};
if(C[cur].g)r.gphone=okPhone($('gphone').value);return r}
function prog(){var r=checks(),k=Object.keys(r),n=k.filter(function(x){return r[x]}).length;$('prog').style.width=(n/k.length*100)+'%'}
['name','age','phone','gphone'].forEach(function(i){$(i).oninput=function(){var r=checks();this.classList.toggle('ok',!!r[i]);this.classList.remove('bad');setE(i);prog()}});
// GitHub Pages submits to the HTTPS Node.js API on the VPS via WireGuard.
var REGISTRATION_API='https://register-quran-scout.online/api/register';
$('f').onsubmit=async function(e){
 e.preventDefault();
 $('msg').textContent='';
 var r=checks(),M={name:'أدخل الاسم الكامل',age:'أدخل عمراً صحيحاً',phone:'رقم الهاتف غير صحيح',gphone:'رقم ولي الأمر غير صحيح'},bad=false;
 Object.keys(M).forEach(function(k){setE(k);if(k in r&&!r[k]){setE(k,M[k]);$(k).classList.add('bad');bad=true}});
 if(bad)return;
 var d={name:$('name').value.trim(),age:parseInt(toEn($('age').value),10),phone:toEn($('phone').value.trim()),type:cur,guardianPhone:C[cur].g?toEn($('gphone').value.trim()):'',website:$('website').value||''};
 $('send').disabled=true;
 $('msg').style.color='var(--mute)';
 $('msg').textContent='جاري إرسال التسجيل...';
 try{
   var response=await fetch(REGISTRATION_API,{
     method:'POST',
     headers:{'Content-Type':'application/json'},
     body:JSON.stringify(d),
     cache:'no-store'
   });
   var res;
   try{res=await response.json()}catch(_){throw new Error('INVALID_RESPONSE')}
   if(response.ok&&res&&res.ok&&res.ref){
     $('ref').textContent=res.ref;
     $('formBox').style.display='none';
     $('done').style.display='block';
     $('f').reset();
     document.querySelectorAll('input').forEach(function(i){i.classList.remove('ok','bad')});
     $('msg').textContent='';
     prog();
   }else{
     $('msg').style.color='var(--red)';
     $('msg').textContent=(res&&typeof res.message==='string')?res.message:'ما قدرنا نرسل التسجيل. حاول مرة ثانية أو تواصل مع المنظمين.';
   }
 }catch(err){
   $('msg').style.color='var(--red)';
   $('msg').textContent='تعذّر الاتصال بخدمة التسجيل. تأكد من الإنترنت وحاول مرة أخرى.';
 }finally{
   $('send').disabled=false;
 }
};
$('again').onclick=function(){show(cur)};
show('scout');
$('sl1').src=$('lgScout').querySelector('img').src;$('sl2').src=$('lgKhatta').querySelector('img').src;
function count(){document.querySelectorAll('[data-n]').forEach(function(e){var n=+e.dataset.n,i=0;clearInterval(e._t);e.textContent=0;e._t=setInterval(function(){i++;e.textContent=i;if(i>=n)clearInterval(e._t)},200)})}
$('chg').onclick=function(){document.documentElement.classList.remove('entered');$('splash').classList.remove('gone');window.scrollTo(0,0)};
window.addEventListener('scroll',function(){var h=document.documentElement.scrollHeight-innerHeight;$('sp').style.width=(h>0?scrollY/h*100:0)+'%'});
var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('vis');if(e.target.id==='stats')count()}})},{threshold:.15});
document.querySelectorAll('.rv').forEach(function(e){io.observe(e)});
document.querySelectorAll('.ch').forEach(function(b){b.onclick=function(){show(b.dataset.t);$('splash').classList.add('gone');document.documentElement.classList.add('entered');window.scrollTo(0,0)}});

</script>
</body>
</html>
